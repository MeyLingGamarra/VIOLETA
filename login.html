<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>VIOLETA | Iniciar sesión</title>

    <link
        rel="stylesheet"
        href="css/styles.css">

</head>


<body class="pagina-login">


    <!-- =========================
         LOGIN
    ========================== -->

    <main class="login-contenedor">


        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="img/logo.png"
                    alt="Logo de VIOLETA">

                <h1>
                    VIOLETA
                </h1>

                <p>
                    Acceso administrativo
                </p>

            </div>


            <!-- TÍTULO -->

            <div class="login-titulo">

                <h2>
                    Iniciar sesión
                </h2>

                <p>
                    Ingresá para acceder al panel
                    de administración.
                </p>

            </div>


            <!-- FORMULARIO -->

            <form
                id="formLogin"
                class="form-login">


                <!-- USUARIO -->

                <div class="campo-login">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresá tu usuario"
                        required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="campo-login">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Ingresá tu contraseña"
                        required>

                </div>


                <!-- MENSAJE DE ERROR -->

                <p
                    id="mensajeLogin"
                    class="mensaje-login">
                </p>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="boton-login">

                    Iniciar sesión

                </button>


            </form>


            <!-- VOLVER -->

            <a
                href="index.html"
                class="volver-inicio-login">

                ← Volver al inicio

            </a>


            <!-- ACLARACIÓN -->

            <p class="login-aviso">

                Acceso de demostración para el
                prototipo académico.

            </p>


        </div>


    </main>


    <!-- JAVASCRIPT -->

    <script src="js/sesion.js"></script>

</body>

</html>
